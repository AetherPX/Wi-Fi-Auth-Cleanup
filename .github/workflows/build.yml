name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Uploading a folder through GitHub's web UI does not delete files that were removed
      # locally. Remove launcher sources from older revisions so the APK remains a pure module
      # and stale activity_main.xml cannot break resource linking.
      - name: Remove obsolete launcher UI
        run: |
          rm -f app/src/main/java/io/github/wifipasswordguard/MainActivity.java
          rm -f app/src/main/res/layout/activity_main.xml

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # Android 17 is published as "platforms;android-37.0" (there is no
      # "platforms;android-37"), but AGP resolves compileSdk 37 through the
      # "platforms/android-37" directory. Install the real package and add a
      # compatibility symlink so both layouts work.
      - name: Install Android 17 SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0"
          if [ -d "$SDK_ROOT/platforms/android-37.0" ] \
              && [ ! -e "$SDK_ROOT/platforms/android-37" ]; then
            ln -sfn "android-37.0" "$SDK_ROOT/platforms/android-37"
          fi
          ls -l "$SDK_ROOT/platforms"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WifiPasswordGuard-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
